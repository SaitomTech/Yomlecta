[package]
name = "yomlecta"
version = "0.26.0"
description = "A macOS app for turning lecture videos into structured notes"
authors = ["SaitomTech"]
license = "MIT"
repository = "https://github.com/SaitomTech/Yomlecta"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
sha2 = "0.11.0"
futures-util = "0.3.34"
keyring = "4.2.0"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-shell = "2.3.6"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1.53.1", features = ["time"] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
  "macros",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSDictionary",
  "NSGeometry",
  "NSObject",
  "NSString",
  "NSURL",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "objc2-app-kit",
  "WKPreferences",
  "WKWebView",
  "WKWebViewConfiguration",
] }
